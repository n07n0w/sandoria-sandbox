name: Build and Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=${{ github.ref_name }}-
            type=raw,value=${{ github.ref_name }}-latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=0.0.0
            BRANCH=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD=${{ github.run_number }}

      - id: image
        run: echo "image=ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          DOCKER_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}
          SENTRY_SAMPLE_RATE: ${{ secrets.SENTRY_SAMPLE_RATE }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          envs: DBASE_URL,OCKER_IMAGE,GHCR_TOKEN,GHCR_USERNAME,DB_HOST,DB_PORT,DB_USER,DB_PASSWORD,DB_NAME,SENTRY_DSN,SENTRY_ENVIRONMENT,SENTRY_SAMPLE_RATE
          script: |
            APP_DIR=/opt/sandoria-sandbox
            mkdir -p $APP_DIR
            mkdir -p /opt/sandoria-sandbox/logs-data
  
            # Login to GHCR
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
  
            # Pull latest image
            docker pull "${DOCKER_IMAGE}"
  
            # Stop and remove old container if exists
            docker stop sandbox-app || true
            docker rm sandbox-app || true
  
            # Write environment files
            cat > $APP_DIR/.env <<EOF
              BASE_URL=${BASE_URL}
              NODE_ENV=production
              PORT=3000
              DB_HOST=${DB_HOST}
              DB_PORT=${DB_PORT}
              DB_USER=${DB_USER}
              DB_PASSWORD=${DB_PASSWORD}
              DB_NAME=${DB_NAME}
              SENTRY_DSN=${SENTRY_DSN}
              SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT}
              SENTRY_SAMPLE_RATE=${SENTRY_SAMPLE_RATE}
            EOF

            cat > $APP_DIR/.env.version <<EOF
              DOCKER_IMAGE=${DOCKER_IMAGE}
            EOF

            # Run new container
            docker run -d \
            --name sandbox-app \
            -e DB_HOST=${DB_HOST} \
            -e DB_PORT=${DB_PORT} \
            -e DB_USER=${DB_USER} \
            -e DB_PASSWORD=${DB_PASSWORD} \
            -e DB_NAME=${DB_NAME} \
            -e BASE_URL=${BASE_URL} \
            --restart unless-stopped \
            -p 3001:3000 \
            --env-file $APP_DIR/.env \
            --env-file $APP_DIR/.env.version \
            -v /opt/sandoria-sandbox/logs-data:/app/logs \
            "${DOCKER_IMAGE}"
            sleep 5
            if docker ps --filter "name=sandbox-app" --filter "status=running" | grep -q sandbox-app; then
            echo "✅ Container started successfully"
            else
            echo "❌ Container failed to start"
            docker logs sandbox-app || true
            exit 1
            fi
