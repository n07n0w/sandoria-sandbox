name: Build and Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch: # Позволяет запустить вручную

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ contains(github.ref, 'refs/tags') && github.ref_name || '0.0.0' }}
            BRANCH=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD=${{ github.run_number }}

      - name: 📝 Output image reference
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: 🚀 Deploy to Server
        uses: appleboy/ssh-action@v1
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}
          SENTRY_SAMPLE_RATE: ${{ secrets.SENTRY_SAMPLE_RATE }}
          DOCKER_IMAGE: ${{ needs.build.outputs.image }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          envs: SENTRY_DSN,SENTRY_ENVIRONMENT,SENTRY_SAMPLE_RATE,DOCKER_IMAGE
          script: |
            VERSION="${{ contains(github.ref, 'refs/tags') && github.ref_name || '0.0.0' }}"
            BRANCH="${{ github.ref_name }}"
            COMMIT="${{ github.sha }}"
            BUILD="${{ github.run_number }}"
            BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            SHORT_COMMIT="${COMMIT:0:7}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Starting Deployment"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 VERSION:    $VERSION"
            echo "🌿 BRANCH:     $BRANCH"
            echo "🔖 COMMIT:     $SHORT_COMMIT"
            echo "🔢 BUILD:      $BUILD"
            echo "⏰ BUILT_AT:   $BUILT_AT"
            echo "🐳 IMAGE:      $DOCKER_IMAGE"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Создаем файл с метаданными версии
            cat > /home/sandoria-sandbox/.env.version <<EOF
            VERSION=$VERSION
            BRANCH=$BRANCH
            COMMIT=$SHORT_COMMIT
            BUILD=$BUILD
            BUILT_AT=$BUILT_AT
            DOCKER_IMAGE=$DOCKER_IMAGE
            EOF

            # Создаем .env файл с Sentry конфигурацией
            cat > /home/sandoria-sandbox/.env <<EOF
            # Sentry Configuration
            SENTRY_DSN=${SENTRY_DSN}
            SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT}
            SENTRY_SAMPLE_RATE=${SENTRY_SAMPLE_RATE}

            # Docker Image
            DOCKER_IMAGE=${DOCKER_IMAGE}

            # Database Configuration (add your DB settings here)
            # DB_HOST=db
            # DB_PORT=3306
            # DB_USER=sandboxuser
            # DB_PASSWORD=sandboxuser_pass
            # DB_NAME=sandbox
            EOF

            echo ""
            echo "📥 Updating code and configs..."
            cd /home/sandoria-sandbox/
            git pull

            echo ""
            echo "🛑 Stopping application container..."
            docker-compose stop app
            docker-compose rm -f app

            echo ""
            echo "🐳 Pulling new Docker image..."
            docker pull ${DOCKER_IMAGE}

            echo ""
            echo "🚀 Starting application with new image..."
            docker-compose up -d app

            echo ""
            echo "⏳ Waiting for application to start..."
            sleep 10

            echo ""
            echo "🔍 Checking container status..."
            docker-compose ps

            echo ""
            echo "📋 Application logs (last 20 lines):"
            docker-compose logs --tail=20 app

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ Deployment Complete!"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: ✅ Deployment Summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ DEPLOYMENT SUCCESSFUL!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌐 Application deployed to production"
          echo "🔖 Version: ${{ contains(github.ref, 'refs/tags') && github.ref_name || '0.0.0' }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "🔖 Commit: ${{ github.sha }}"
          echo ""
          echo "🎉 Your changes are now live!"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ DEPLOYMENT FAILED!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Please check the logs above for details."
          echo ""
          echo "Common issues:"
          echo "  • SSH connection problems"
          echo "  • Docker build failures"
          echo "  • Git pull conflicts"
          echo "  • Container startup errors"
          echo ""
          echo "💡 Check server logs:"
          echo "  ssh ${{ secrets.USER }}@${{ secrets.HOST }}"
          echo "  cd /home/sandoria-sandbox"
          echo "  docker-compose logs"
