version: "3.9"


services:
  app:
    image: ${DOCKER_IMAGE}
    restart: unless-stopped
  env_file:
    - .env
    - .env.version
  ports:
    - "3001:3000"
  volumes:
    - logs-data:/app/logs
  environment:
    NODE_ENV: production
    PORT: 3000
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  logging:
    driver: json-file
    options:
    max-size: "10m"
    max-file: "3"

volumes:
  logs-data:
