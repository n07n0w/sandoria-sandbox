version: "3.9"

services:
  app:
    image: ${DOCKER_IMAGE:-ghcr.io/n07n0w/sandoria-sandbox:latest-dev}
    container_name: sandbox-app
    restart: unless-stopped
    env_file:
      - .env
      - .env.version
    ports:
      - "3001:3000"
    volumes:
      - logs-data:/app/logs
    environment:
      # Database connection to host MySQL
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: ${DB_NAME:-sandbox}
      NODE_ENV: production
    # Allow container to access host services
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Health check for the application
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  logs-data:
